name: Source and small technical tests
on: [push, pull_request]
jobs:
  technical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r envs/lightweight_ci_requirements.txt
      - run: python scripts/11_quality_audit.py --source-only
      - run: python -m unittest discover -s tests -v
      # No public raw-data downloads, biological model training or fixture-as-result job.
